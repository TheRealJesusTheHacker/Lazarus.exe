name: release

# Builds and publishes a Lazarus release when a release is
# dispatched with a version (v1.0.0, v1.0.1, ...); dispatching with
# the version empty is a proof run (suite, build, self-check —
# nothing is attached). Tag pushes no longer trigger this workflow
# (2026-10-27). One Windows job, in an order that
# keeps the release honest:
#   * the FULL test suite runs first, offscreen — if it fails,
#     nothing builds and nothing uploads;
#   * the release is then built by the same script used locally
#     (tools/build_release.py), so CI ships what local builds prove;
#   * the built exe must pass its --self-check (exit code 0)
#     before anything is attached to the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to create (e.g. v1.0.6). Leave empty for a dry run: builds only, nothing uploaded."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version input
        if: inputs.version != ''
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ($env:VERSION_INPUT -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            Write-Host "::error::version input '$env:VERSION_INPUT' is not a valid release version (expected vX.Y.Z)"
            exit 1
          }
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install what the build needs
        # Hash-locked (owner policy 2026-10-25): every package is
        # verified against packaging/requirements-ci.lock.txt and
        # the install fails loudly on any mismatch. The lock is
        # the full resolved set for the pins in
        # packaging/requirements-ci.txt -- bump pins there only
        # together with a regenerated lock (see the lock header).
        run: pip install --require-hashes -r packaging/requirements-ci.lock.txt

      - name: Run the full test suite (interface offscreen)
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          # Unbuffered, so the run log shows progress test by
          # test instead of one block at the end — a stall names
          # the test it stopped on.
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q

      - name: Build the release (exe, portable zip, checksums)
        run: python tools/build_release.py

      # The exe is windowed, so it is started with Start-Process
      # -Wait: a plain "&" launch returns before the program has
      # finished, and its exit code would never be seen.
      - name: Smoke-test the built exe (--self-check must exit 0)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Lazarus.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "Lazarus.exe --self-check failed with exit code $($proc.ExitCode)."
            exit 1
          }
          Write-Host "Lazarus.exe --self-check passed."

      - name: Create the release if it does not exist yet
        if: inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:GITHUB_SHA" --title "$env:RELEASE_TAG" --generate-notes
          }
      - name: Attach the release files to the GitHub release
        if: inputs.version != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            dist/Lazarus.exe
            dist/LazarusPortable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
